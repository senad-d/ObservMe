auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /var/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

distributor:
  # Loki 3.0 indexes configured OTLP resource attributes. The Collector's
  # groupbyattrs processor moves only this bounded selector set to log resources.
  otlp_config:
    default_resource_attributes_as_index_labels:
      - service.name
      - service.namespace
      - event.name
      - event.category
      - pi.session.id
      - pi.workflow.id
      - pi.agent.id
      - pi.agent.display_name
      - pi.agent.parent_id
      - pi.agent.child.id
      - pi.agent.run.id
      - pi.tool.name
      - pi.tool.category
      - error.type
      - gen_ai.provider.name
      - gen_ai.request.model
      - pi.llm.stop_reason
      - pi.llm.content.kind
      - trace_id
      - span_id
      - pi.bash.exit_code

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /var/loki/chunks
  tsdb_shipper:
    active_index_directory: /var/loki/index
    cache_location: /var/loki/cache

compactor:
  working_directory: /var/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  enable_api: true
  rule_path: /var/loki/rules-temp
  storage:
    type: local
    local:
      directory: /var/loki/rules

# Retention is configured via limits_config.retention_period.
limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  max_label_names_per_series: 30

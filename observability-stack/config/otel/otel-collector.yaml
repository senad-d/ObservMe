extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /healthz

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  resource/observme:
    attributes:
      - key: telemetry.source
        value: observme
        action: upsert
      - key: service.name
        value: observme-pi-extension
        action: insert
      - key: service.namespace
        value: pi
        action: upsert
  resource/drop_high_cardinality_metric_attrs:
    attributes:
      - key: pi.workflow.id
        action: delete
      - key: pi.workflow.root_agent_id
        action: delete
      - key: pi.agent.id
        action: delete
      - key: pi.agent.parent_id
        action: delete
      - key: pi.agent.root_id
        action: delete
      # Child display names and capabilities are valid trace/log resource
      # attributes, but are launcher-defined and must never become
      # Prometheus labels through resource_to_telemetry_conversion.
      - key: pi.agent.display_name
        action: delete
      - key: pi.agent.capability
        action: delete
      - key: pi.agent.child.display_name
        action: delete
      - key: pi.agent.child.capability
        action: delete
      - key: pi.agent.run.id
        action: delete
      - key: pi.agent.spawn.id
        action: delete
      - key: pi.agent.spawn.tool_call_id
        action: delete
      - key: pi.agent.child.id
        action: delete
      - key: pi.session.id
        action: delete
  # Drops accidental content attributes from logs. Intentional LLM and failed-tool
  # content capture is emitted as policy-processed log bodies and opt-in span attributes.
  attributes/drop_content_attributes:
    actions:
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: pi.llm.prompt.redacted
        action: delete
      - key: pi.llm.response.redacted
        action: delete
      - key: pi.llm.thinking.redacted
        action: delete
      - key: pi.tool.arguments.redacted
        action: delete
      - key: pi.tool.result.redacted
        action: delete
  # Promote display name only in Loki, alongside the already-indexed agent ID.
  # A valid agent keeps one display name, so this functional dependency does not
  # partition its existing agent-ID streams further. Capabilities remain metadata.
  attributes/loki_query_hints:
    actions:
      - key: loki.attribute.labels
        value: event.name,event.category,pi.session.id,pi.workflow.id,pi.agent.id,pi.agent.display_name,pi.agent.parent_id,pi.agent.child.id,pi.agent.run.id,pi.tool.name,pi.tool.category,error.type,gen_ai.provider.name,gen_ai.request.model,pi.llm.stop_reason,pi.llm.content.kind,trace_id,span_id,pi.bash.exit_code
        action: insert
  # Loki 3.0 can select configured OTLP resource attributes as index labels but
  # cannot promote arbitrary log attributes. Group only the bounded selector set
  # into per-record resources before native OTLP ingestion.
  groupbyattrs/loki_index_labels:
    keys:
      - event.name
      - event.category
      - pi.session.id
      - pi.workflow.id
      - pi.agent.id
      - pi.agent.display_name
      - pi.agent.parent_id
      - pi.agent.child.id
      - pi.agent.run.id
      - pi.tool.name
      - pi.tool.category
      - error.type
      - gen_ai.provider.name
      - gen_ai.request.model
      - pi.llm.stop_reason
      - pi.llm.content.kind
      - trace_id
      - span_id
      - pi.bash.exit_code
  resource/loki_query_hints:
    attributes:
      - key: loki.resource.labels
        value: service.name
        action: insert
  batch:
    timeout: 5s
    send_batch_size: 8192

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Exporter-wide stale-series/cardinality cleanup for gauges, counters, and
    # histograms. Five minutes exceeds ObservMe's default one-minute active-agent
    # lease; lease-aware PromQL, not expiration, determines liveness.
    metric_expiration: 5m
    resource_to_telemetry_conversion:
      enabled: true
  # Native OTLP ingestion retains non-indexed log/resource attributes as Loki
  # structured metadata. Loki indexes bounded selectors plus display name, which
  # is presentation-only and functionally dependent on the indexed agent ID.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/observme, resource/drop_high_cardinality_metric_attrs, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      # Display name is a Loki-only index label for the bounded name-to-agent-ID
      # dashboard lookup; other identity presentation attributes remain metadata.
      processors: [memory_limiter, resource/observme, resource/loki_query_hints, attributes/drop_content_attributes, attributes/loki_query_hints, groupbyattrs/loki_index_labels, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      # Tempo retains the complete validated agent and child identity attributes.
      processors: [memory_limiter, resource/observme, batch]
      exporters: [otlp/tempo]
